version: '3.8'

# ================================================
# NEXO IA - Multi-Tenant SIN SSL (Solo IP)
# Para usar sin dominio, acceso directo por IP:PUERTO
# ================================================

networks:
  nexo_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  # ================================================
  # POSTGRESQL - Base de datos compartida
  # ================================================
  postgres:
    image: postgres:15-alpine
    container_name: nexo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-nexo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-ChangeThisPassword123!}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexo_network
    ports:
      - "5432:5432"  # Expuesto para acceso directo si necesitas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-nexo_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # REDIS - Cache compartido
  # ================================================
  redis:
    image: redis:7-alpine
    container_name: nexo_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-RedisPassword123!}
    volumes:
      - redis_data:/data
    networks:
      - nexo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # PANEL DE CONTROL - Gestión Web
  # Acceso: http://TU_IP:3000
  # ================================================
  control_panel:
    image: python:3.11-slim
    container_name: nexo_control_panel
    restart: unless-stopped
    working_dir: /app
    command: bash -c "pip install -q flask flask-sqlalchemy psycopg2-binary requests && python app.py"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_ADMIN_USER:-nexo_admin}:${POSTGRES_ADMIN_PASSWORD:-ChangeThisPassword123!}@postgres:5432/nexo_control
      - SECRET_KEY=${PANEL_SECRET_KEY:-secret-key-change-this}
      - PANEL_ADMIN_USER=${PANEL_ADMIN_USER:-admin}
      - PANEL_ADMIN_PASSWORD=${PANEL_ADMIN_PASSWORD:-admin123}
      - VPS_IP=${VPS_IP:-localhost}
      - BASE_PORT=${BASE_PORT:-5678}
    volumes:
      - ./control-panel:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - ./instances:/app/instances
    networks:
      - nexo_network
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

# ================================================
# NOTA: Las instancias de n8n se crearán dinámicamente
# Cada una en un puerto diferente:
# - Cliente 1: http://TU_IP:5678
# - Cliente 2: http://TU_IP:5679
# - Cliente 3: http://TU_IP:5680
# etc.
# ================================================
